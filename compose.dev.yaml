services:
  postgres:
    image: postgres:17.8-bookworm
    environment:
      POSTGRES_DB: ai_call
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_call"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7.4.7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio:
    image: quay.io/minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-07-21T05-28-08Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mc alias set local http://minio:9000 minioadmin minioadmin
        mc mb --ignore-existing local/recordings
        mc ilm rule import local/recordings < /config/recording-lifecycle.json
        mc anonymous set private local/recordings
    volumes:
      - ./infra/minio/recording-lifecycle.json:/config/recording-lifecycle.json:ro
    restart: "no"

  migrate:
    build:
      context: ./apps/api
      target: development
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/ai_call
    command: ["/app/.venv/bin/alembic", "-c", "/app/alembic.ini", "upgrade", "head"]
    volumes:
      - ./apps/api/app:/app/app
      - ./apps/api/alembic:/app/alembic
      - ./apps/api/alembic.ini:/app/alembic.ini:ro
    restart: "no"

  api:
    build:
      context: ./apps/api
      target: development
    env_file:
      - path: ./apps/api/.env
        required: false
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/ai_call
      REDIS_URL: redis://redis:6379/0
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      STORAGE_BUCKET_NAME: recordings
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_REGION: us-east-1
    command: ["/app/.venv/bin/uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "/app/app", "--reload-dir", "/app/alembic"]
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./apps/api/app:/app/app
      - ./apps/api/alembic:/app/alembic
      - ./apps/api/alembic.ini:/app/alembic.ini:ro
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).read()"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  worker:
    build:
      context: ./apps/api
      target: development
    env_file:
      - path: ./apps/api/.env
        required: false
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/ai_call
      REDIS_URL: redis://redis:6379/0
      STORAGE_BUCKET_NAME: recordings
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_REGION: us-east-1
    command: ["/app/.venv/bin/arq", "app.workers.arq_worker.WorkerSettings"]
    volumes:
      - ./apps/api/app:/app/app
    restart: unless-stopped

  agent:
    build:
      context: ./apps/agent
      target: development
    env_file:
      - path: ./apps/agent/.env
        required: false
    depends_on:
      api:
        condition: service_healthy
      worker:
        condition: service_started
    environment:
      APP_ENV: development
      API_BASE_URL: http://api:8000
      REDIS_URL: redis://redis:6379/0
    command: ["/app/.venv/bin/python", "-m", "agent.main", "start"]
    volumes:
      - ./apps/agent/agent:/app/agent
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
      target: development
    env_file:
      - path: ./apps/web/.env
        required: false
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: development
      API_BASE_URL: http://api:8000
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_REALTIME_ENABLED: "false"
    command: ["/app/node_modules/.bin/next", "dev", "--hostname", "0.0.0.0", "--webpack"]
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./apps/web:/app
      - web_node_modules:/app/node_modules
      - web_next:/app/.next
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  minio_data:
  web_node_modules:
  web_next:
