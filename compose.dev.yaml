x-api-env-files: &api-env-files
  - path: ./apps/api/.env
    required: false

x-worker-environment: &worker-environment
  APP_ENV: development
  DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/ai_call
  REDIS_URL: redis://redis:6379/0
  AUTH_PROVIDER: clerk
  LOCAL_AUTH_TOKEN: ""
  BILLING_MODE: fake
  CARRIER_LOOKUP_MODE: fake
  TELEPHONY_MODE: fake
  TELNYX_ORDERING_ENABLED: "false"
  ACTIVATION_FLOW_ENABLED: "true"
  WORKER_LIFECYCLE_MAX_JOBS: ${WORKER_LIFECYCLE_MAX_JOBS:-10}
  WORKER_BACKGROUND_MAX_JOBS: ${WORKER_BACKGROUND_MAX_JOBS:-4}
  CLERK_ISSUER: ""
  CLERK_AUDIENCE: ""
  CLERK_AUTHORIZED_PARTIES: ""
  CLERK_JWT_KEY: ""
  CLERK_JWKS_URL: ""
  CLERK_WEBHOOK_SECRET: ""
  SUPABASE_URL: ""
  SUPABASE_JWT_AUDIENCE: ""
  STRIPE_SECRET_KEY: ""
  STRIPE_WEBHOOK_SECRET: ""
  STRIPE_PRICE_STARTER: ""
  STRIPE_CHECKOUT_SUCCESS_URL: ""
  STRIPE_CHECKOUT_CANCEL_URL: ""
  STRIPE_BILLING_PORTAL_RETURN_URL: ""
  STRIPE_BILLING_PORTAL_CONFIGURATION_ID: ""
  TELNYX_API_KEY: ""
  TELNYX_ACTIVE_CONNECTION_ID: ""
  TELNYX_DISABLED_CONNECTION_ID: ""
  FIREBASE_CREDENTIALS_JSON: ""

x-lifecycle-background-secret-mask: &lifecycle-background-secret-mask
  AGENT_DISPATCH_JWT_SECRET: ""
  LIVEKIT_API_KEY: ""
  LIVEKIT_API_SECRET: ""
  GEMINI_API_KEY: ""
  S3_ACCESS_KEY: ""
  S3_SECRET_KEY: ""

x-background-storage-environment: &background-storage-environment
  STORAGE_BUCKET_NAME: recordings
  S3_ENDPOINT_URL: http://minio:9000
  S3_ACCESS_KEY: minioadmin
  S3_SECRET_KEY: minioadmin
  S3_REGION: us-east-1

x-lifecycle-worker-environment: &lifecycle-worker-environment
  <<: [*worker-environment, *lifecycle-background-secret-mask]

x-background-worker-environment: &background-worker-environment
  <<: [*worker-environment, *background-storage-environment]

x-worker-service: &worker-service
  build:
    context: .
    dockerfile: apps/api/Dockerfile
    target: development
  env_file: *api-env-files
  depends_on:
    migrate:
      condition: service_completed_successfully
    redis:
      condition: service_healthy
    minio-init:
      condition: service_completed_successfully
  volumes:
    - ./apps/api/app:/app/app
  restart: unless-stopped

services:
  postgres:
    image: postgres:17.8-bookworm
    environment:
      POSTGRES_DB: ai_call
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_call"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7.4.7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio:
    image: quay.io/minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-07-21T05-28-08Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mc alias set local http://minio:9000 minioadmin minioadmin
        mc mb --ignore-existing local/recordings
        mc anonymous set private local/recordings
    restart: "no"

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: development
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/ai_call
    command: ["/app/.venv/bin/alembic", "-c", "/app/alembic.ini", "upgrade", "head"]
    volumes:
      - ./apps/api/app:/app/app
      - ./apps/api/alembic:/app/alembic
      - ./apps/api/alembic.ini:/app/alembic.ini:ro
    restart: "no"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: development
    env_file: *api-env-files
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      APP_ENV: development
      DASHBOARD_METRICS_REFERENCE_TIME:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/ai_call
      REDIS_URL: redis://redis:6379/0
      CORS_ALLOWED_ORIGINS: http://127.0.0.1:${WEB_PORT:-3000},http://localhost:${WEB_PORT:-3000}
      AUTH_PROVIDER: "${AUTH_PROVIDER:-clerk}"
      LOCAL_AUTH_TOKEN: "${LOCAL_AUTH_TOKEN:-}"
      CLERK_AUTHORIZED_PARTIES: "${CLERK_AUTHORIZED_PARTIES:-http://127.0.0.1:${WEB_PORT:-3000},http://localhost:${WEB_PORT:-3000}}"
      BILLING_MODE: fake
      CARRIER_LOOKUP_MODE: "${CARRIER_LOOKUP_MODE:-telnyx}"
      TELEPHONY_MODE: fake
      ACTIVATION_FLOW_ENABLED: "true"
      STORAGE_BUCKET_NAME: recordings
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_REGION: us-east-1
    command: ["/app/.venv/bin/uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "/app/app", "--reload-dir", "/app/alembic"]
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - ./apps/api/app:/app/app
      - ./apps/api/alembic:/app/alembic
      - ./apps/api/alembic.ini:/app/alembic.ini:ro
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).read()"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  worker-lifecycle:
    <<: *worker-service
    environment: *lifecycle-worker-environment
    command: ["/app/.venv/bin/arq", "app.workers.arq_worker.CallLifecycleWorkerSettings"]
    healthcheck:
      test: ["CMD", "/app/.venv/bin/arq", "--check", "app.workers.arq_worker.CallLifecycleWorkerSettings"]
      interval: 5s
      timeout: 5s
      retries: 20
    stop_grace_period: 75s

  worker-background:
    <<: *worker-service
    environment: *background-worker-environment
    command: ["/app/.venv/bin/arq", "app.workers.arq_worker.BackgroundWorkerSettings"]
    healthcheck:
      test: ["CMD", "/app/.venv/bin/arq", "--check", "app.workers.arq_worker.BackgroundWorkerSettings"]
      interval: 5s
      timeout: 5s
      retries: 20
    stop_grace_period: 45s

  agent:
    profiles: ["voice"]
    build:
      context: .
      dockerfile: apps/agent/Dockerfile
      target: development
    env_file:
      - path: ./apps/agent/.env
        required: false
    depends_on:
      api:
        condition: service_healthy
      worker-lifecycle:
        condition: service_healthy
    environment:
      APP_ENV: development
      API_BASE_URL: http://api:8000
      REDIS_URL: redis://redis:6379/0
    command: ["/app/.venv/bin/python", "-m", "agent.main", "start"]
    volumes:
      - ./apps/agent/agent:/app/agent
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
      target: development
    env_file:
      - path: ./apps/web/.env
        required: false
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: development
      AUTH_PROVIDER: "${AUTH_PROVIDER:-clerk}"
      LOCAL_AUTH_TOKEN: "${LOCAL_AUTH_TOKEN:-}"
      BILLING_MODE: fake
      TELEPHONY_MODE: fake
      API_BASE_URL: http://api:8000
      NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:${API_PORT:-8000}
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:${WEB_PORT:-3000}
      NEXT_PUBLIC_REALTIME_ENABLED: "false"
    command: ["/app/node_modules/.bin/next", "dev", "--hostname", "0.0.0.0", "--webpack"]
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    volumes:
      - ./apps/web:/app
      - web_node_modules:/app/node_modules
      - web_next:/app/.next
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  minio_data:
  web_node_modules:
  web_next:
