[project]
name = "ai-call-assistant-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.16,<2.0",
  "arq>=0.26,<1.0",
  "fastapi>=0.115,<1.0",
  "firebase-admin>=7.0,<8.0",
  "google-genai>=1.69.0",
  "livekit-api>=1.0,<2.0",
  "minio>=7.2,<8.0",
  "phonenumbers>=9.0,<10.0",
  "pydantic-settings>=2.10,<3.0",
  "pyjwt>=2.10,<3.0",
  "redis>=5.0,<6.0",
  "slowapi>=0.1.9,<1.0",
  "sqlalchemy>=2.0,<3.0",
  "stripe>=15.0.0",
  "svix>=1.80,<2.0",
  "telnyx>=2.0,<3.0",
  "uvicorn>=0.34,<1.0",
]

[dependency-groups]
dev = [
  "asyncpg>=0.30,<1.0",
  "aiosqlite>=0.21,<1.0",
  "httpx>=0.28,<1.0",
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=1.1,<2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
