[project]
name = "ai-call-assistant-api"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
  "alembic>=1.16,<2.0",
  "arq>=0.26,<1.0",
  "asyncpg>=0.30,<1.0",
  "fastapi>=0.115,<1.0",
  "firebase-admin>=7.0,<8.0",
  "google-genai>=1.69.0",
  "livekit-api>=1.0,<2.0",
  "minio>=7.2,<8.0",
  "opentelemetry-api>=1.39,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.39,<2",
  "opentelemetry-sdk>=1.39,<2",
  "phonenumbers>=9.0,<10.0",
  "pydantic-settings>=2.14.2,<3.0",
  "pyjwt>=2.13,<3.0",
  "redis>=5.0,<6.0",
  "slowapi>=0.1.9,<1.0",
  "sqlalchemy>=2.0,<3.0",
  "stripe>=15.0.0",
  "svix>=1.80,<2.0",
  "telnyx>=2.0,<3.0",
  "uvicorn>=0.34,<1.0",
]

[dependency-groups]
dev = [
  "aiosqlite>=0.21,<1.0",
  "anyio>=4.12,<5.0",
  "httpx>=0.28,<1.0",
  "mypy>=2.3,<3",
  "pip-audit>=2.10.1,<3",
  "pytest>=9.0.3,<10.0",
  "pytest-asyncio>=1.1,<2.0",
  "pytest-cov>=7.1,<8",
  "pytest-timeout>=2.4,<3",
  "ruff>=0.15.21,<0.16",
]

[tool.uv]
constraint-dependencies = [
  "aiohttp>=3.14.1",
  "click>=8.3.3",
  "cryptography>=48.0.1",
  "idna>=3.15",
  "mako>=1.3.12",
  "msgpack>=1.2.1",
  "pyasn1>=0.6.3",
  "pygments>=2.20.0",
  "requests>=2.33.0",
  "starlette>=1.3.1",
  "urllib3>=2.7.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
required_plugins = [
  "pytest-cov>=7.1,<8",
  "pytest-timeout>=2.4,<3",
]
timeout = 60

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.13"
plugins = ["pydantic.mypy"]
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_configs = true
warn_unused_ignores = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["telnyx", "telnyx.http_client"]
ignore_missing_imports = true
