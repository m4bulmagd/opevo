[project]
name = "ai-call-assistant-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.28,<0.29",
  "livekit-agents==1.4.4",
  "livekit-plugins-deepgram==1.4.4",
  "livekit-plugins-elevenlabs==1.4.4",
  "livekit-plugins-google==1.4.4",
  "livekit-plugins-silero==1.4.4",
  "livekit-plugins-speechmatics==1.4.4",
  "livekit-plugins-turn-detector==1.4.4",
  "opentelemetry-api>=1.39,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.39,<2",
  "opentelemetry-sdk>=1.39,<2",
  "pydantic-settings>=2.14.2",
  "redis>=5.0,<6.0",
]

[dependency-groups]
dev = [
  "anyio>=4,<5",
  "mypy>=2.3,<3",
  "pip-audit>=2.10.1,<3",
  "pytest>=9.0.3,<10",
  "ruff>=0.15.21,<0.16",
]

[tool.uv]
constraint-dependencies = [
  "aiohttp>=3.14.1",
  "click>=8.3.3",
  "cryptography>=48.0.1",
  "idna>=3.15",
  "pyasn1>=0.6.3",
  "pygments>=2.20.0",
  "pyjwt>=2.13.0",
  "requests>=2.33.0",
  "urllib3>=2.7.0",
]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.13"
check_untyped_defs = true
show_error_codes = true
warn_unused_ignores = true

[tool.pytest.ini_options]
markers = [
  "livekit_eval: credentialed LiveKit model behavior evaluation",
]

[[tool.mypy.overrides]]
module = ["speechmatics.voice._smart_turn"]
ignore_missing_imports = true
