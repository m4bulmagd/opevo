[project]
name = "ai-call-assistant-agent"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
  "httpx>=0.28,<0.29",
  "livekit-agents==1.6.9",
  "livekit-plugins-deepgram==1.6.9",
  "livekit-plugins-elevenlabs==1.6.9",
  "livekit-plugins-google==1.6.9",
  "livekit-plugins-silero==1.6.9",
  "livekit-plugins-speechmatics==1.6.9",
  "livekit-plugins-turn-detector==1.6.9",
  "opentelemetry-api>=1.39,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.39,<2",
  "opentelemetry-sdk>=1.39,<2",
  "opevo-contracts",
  "pydantic-settings>=2.14.2",
  "redis>=8.1.0,<9.0",
]

[tool.uv.sources]
opevo-contracts = { path = "../../libs/shared" }

[dependency-groups]
dev = [
  "anyio>=4,<5",
  "mypy>=2.3,<3",
  "pip-audit>=2.10.1,<3",
  "pytest>=9.0.3,<10",
  "pytest-cov>=7.1,<8",
  "pytest-timeout>=2.4,<3",
  "ruff>=0.15.21,<0.16",
]

[tool.uv]
constraint-dependencies = [
  "aiohttp>=3.14.3",
  "click>=8.3.3",
  "cryptography>=50.0.0",
  "idna>=3.15",
  "pyasn1>=0.6.3",
  "pygments>=2.20.0",
  "pyjwt>=2.13.0",
  "requests>=2.33.0",
  "urllib3>=2.7.0",
]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.13"
check_untyped_defs = true
show_error_codes = true
warn_unused_ignores = true

[tool.pytest.ini_options]
markers = [
  "livekit_eval: credentialed LiveKit model behavior evaluation",
]
required_plugins = [
  "pytest-cov>=7.1,<8",
  "pytest-timeout>=2.4,<3",
]
timeout = 30

[tool.coverage.run]
branch = true
relative_files = true
source = ["agent"]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
