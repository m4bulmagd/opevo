services:
  postgres:
    image: postgres:17.8-bookworm
    container_name: ai-call-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ai_call
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_call"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4.7-alpine
    container_name: ai-call-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: quay.io/minio/minio:RELEASE.2025-07-23T15-54-02Z
    container_name: ai-call-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-07-21T05-28-08Z
    container_name: ai-call-minio-init
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/recordings
      "
    environment:
      STORAGE_BUCKET_NAME: recordings

  api:
    profiles: ["app"]
    build:
      context: ./apps/api
    container_name: ai-call-api
    env_file:
      - ./apps/api/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/ai_call
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"

  worker:
    profiles: ["app"]
    build:
      context: ./apps/api
    container_name: ai-call-worker
    env_file:
      - ./apps/api/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/ai_call
      REDIS_URL: redis://redis:6379/0
    command: ["uv", "run", "arq", "app.workers.arq_worker.WorkerSettings"]

  agent:
    profiles: ["app"]
    build:
      context: ./apps/agent
    container_name: ai-call-agent
    env_file:
      - ./apps/agent/.env
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_started
      worker:
        condition: service_started
    environment:
      API_BASE_URL: http://api:8000
      REDIS_URL: redis://redis:6379/0

  web:
    profiles: ["app"]
    build:
      context: ./apps/web
    container_name: ai-call-web
    env_file:
      - ./apps/web/.env
    depends_on:
      api:
        condition: service_started
    environment:
      API_BASE_URL: http://api:8000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  redis_data:
  minio_data:
