x-worker-environment: &worker-environment
  APP_ENV: production
  BILLING_MODE: stripe
  TELEPHONY_MODE: telnyx
  ACTIVATION_FLOW_ENABLED: ${ACTIVATION_FLOW_ENABLED:?ACTIVATION_FLOW_ENABLED is required}
  DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
  REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
  STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:?STRIPE_SECRET_KEY is required}
  LIVEKIT_URL: ${LIVEKIT_URL:?LIVEKIT_URL is required}
  LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?LIVEKIT_API_KEY is required}
  LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?LIVEKIT_API_SECRET is required}
  LIVEKIT_AGENT_NAME: ${LIVEKIT_AGENT_NAME:-ai-call-agent}
  TELNYX_API_KEY: ${TELNYX_API_KEY:?TELNYX_API_KEY is required}
  TELNYX_ACTIVE_CONNECTION_ID: ${TELNYX_ACTIVE_CONNECTION_ID:?TELNYX_ACTIVE_CONNECTION_ID is required}
  TELNYX_DISABLED_CONNECTION_ID: ${TELNYX_DISABLED_CONNECTION_ID:?TELNYX_DISABLED_CONNECTION_ID is required}
  TELNYX_ORDERING_ENABLED: ${TELNYX_ORDERING_ENABLED:?TELNYX_ORDERING_ENABLED is required}
  STORAGE_BUCKET_NAME: ${STORAGE_BUCKET_NAME:?STORAGE_BUCKET_NAME is required}
  S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:?S3_ENDPOINT_URL is required}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:?S3_ACCESS_KEY is required}
  S3_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY is required}
  S3_REGION: ${S3_REGION:?S3_REGION is required}
  AGENT_DISPATCH_JWT_SECRET: ${AGENT_DISPATCH_JWT_SECRET:?AGENT_DISPATCH_JWT_SECRET is required}
  SUMMARY_PROVIDER: ${SUMMARY_PROVIDER:?SUMMARY_PROVIDER is required}
  SUMMARY_MODEL: ${SUMMARY_MODEL:?SUMMARY_MODEL is required}
  GEMINI_API_KEY: ${GEMINI_API_KEY:?GEMINI_API_KEY is required}
  MAX_CALL_DURATION_SECONDS: ${MAX_CALL_DURATION_SECONDS:-3600}
  CALL_RECONCILIATION_PENDING_STALE_SECONDS: ${CALL_RECONCILIATION_PENDING_STALE_SECONDS:-120}
  CALL_RECONCILIATION_CONNECTED_STALE_SECONDS: ${CALL_RECONCILIATION_CONNECTED_STALE_SECONDS:-3720}
  CALL_RECONCILIATION_ENDING_GRACE_SECONDS: ${CALL_RECONCILIATION_ENDING_GRACE_SECONDS:-60}
  CALL_RECONCILIATION_FINALIZING_LEASE_SECONDS: ${CALL_RECONCILIATION_FINALIZING_LEASE_SECONDS:-300}
  CALL_RECONCILIATION_MAX_ATTEMPTS: ${CALL_RECONCILIATION_MAX_ATTEMPTS:-5}
  OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}

x-api-environment: &api-environment
  <<: *worker-environment
  AUTH_MODE: clerk
  BILLING_MODE: stripe
  CARRIER_LOOKUP_MODE: telnyx
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required}
  CLERK_ISSUER: ${CLERK_ISSUER:?CLERK_ISSUER is required}
  CLERK_AUTHORIZED_PARTIES: ${CLERK_AUTHORIZED_PARTIES:?CLERK_AUTHORIZED_PARTIES is required}
  CLERK_JWT_KEY: ${CLERK_JWT_KEY:-}
  CLERK_JWKS_URL: ${CLERK_JWKS_URL:-}
  CLERK_JWKS_CACHE_TTL_SECONDS: ${CLERK_JWKS_CACHE_TTL_SECONDS:-300}
  CLERK_JWKS_STALE_GRACE_SECONDS: ${CLERK_JWKS_STALE_GRACE_SECONDS:-600}
  CLERK_JWKS_CONNECT_TIMEOUT_SECONDS: ${CLERK_JWKS_CONNECT_TIMEOUT_SECONDS:-0.5}
  CLERK_JWKS_READ_TIMEOUT_SECONDS: ${CLERK_JWKS_READ_TIMEOUT_SECONDS:-1.0}
  CLERK_JWKS_POOL_TIMEOUT_SECONDS: ${CLERK_JWKS_POOL_TIMEOUT_SECONDS:-0.25}
  CLERK_JWKS_TOTAL_TIMEOUT_SECONDS: ${CLERK_JWKS_TOTAL_TIMEOUT_SECONDS:-2.0}
  CLERK_WEBHOOK_SECRET: ${CLERK_WEBHOOK_SECRET:?CLERK_WEBHOOK_SECRET is required}
  STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:?STRIPE_SECRET_KEY is required}
  STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:?STRIPE_WEBHOOK_SECRET is required}
  STRIPE_PRICE_STARTER: ${STRIPE_PRICE_STARTER:?STRIPE_PRICE_STARTER is required}
  STRIPE_CHECKOUT_SUCCESS_URL: ${STRIPE_CHECKOUT_SUCCESS_URL:?STRIPE_CHECKOUT_SUCCESS_URL is required}
  STRIPE_CHECKOUT_CANCEL_URL: ${STRIPE_CHECKOUT_CANCEL_URL:?STRIPE_CHECKOUT_CANCEL_URL is required}
  STRIPE_BILLING_PORTAL_RETURN_URL: ${STRIPE_BILLING_PORTAL_RETURN_URL:?STRIPE_BILLING_PORTAL_RETURN_URL is required}
  STRIPE_BILLING_PORTAL_CONFIGURATION_ID: ${STRIPE_BILLING_PORTAL_CONFIGURATION_ID:?STRIPE_BILLING_PORTAL_CONFIGURATION_ID is required}

x-service-hardening: &service-hardening
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=128m,uid=10001,gid=10001
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  init: true

services:
  worker:
    <<: *service-hardening
    image: ${API_IMAGE:?API_IMAGE is required}
    environment: *worker-environment
    command: ["/app/.venv/bin/arq", "app.workers.arq_worker.WorkerSettings"]
    restart: unless-stopped
    healthcheck:
      disable: true

  agent:
    <<: *service-hardening
    image: ${AGENT_IMAGE:?AGENT_IMAGE is required}
    environment:
      APP_ENV: production
      LIVEKIT_URL: ${LIVEKIT_URL:?LIVEKIT_URL is required}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:?LIVEKIT_API_KEY is required}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:?LIVEKIT_API_SECRET is required}
      LIVEKIT_AGENT_NAME: ${LIVEKIT_AGENT_NAME:-ai-call-agent}
      API_BASE_URL: ${API_BASE_URL:?API_BASE_URL is required}
      REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
      SPEECHMATICS_API_KEY: ${SPEECHMATICS_API_KEY:?SPEECHMATICS_API_KEY is required}
      GEMINI_API_KEY: ${GEMINI_API_KEY:?GEMINI_API_KEY is required}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      ELEVENLABS_VOICE_ID: ${ELEVENLABS_VOICE_ID:-}
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:-}
      AGENT_DEBUG_STREAMS: "false"
    restart: unless-stopped
    stop_grace_period: 66m

  api:
    <<: *service-hardening
    image: ${API_IMAGE:?API_IMAGE is required}
    environment: *api-environment
    ports:
      - ${API_BIND_ADDRESS:-127.0.0.1}:${API_PORT:-8000}:8000
    restart: unless-stopped

  web:
    <<: *service-hardening
    image: ${WEB_IMAGE:?WEB_IMAGE is required}
    environment:
      AUTH_MODE: clerk
      API_BASE_URL: ${API_BASE_URL:?API_BASE_URL is required}
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:?NEXT_PUBLIC_API_BASE_URL is required}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:?NEXT_PUBLIC_APP_URL is required}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:?NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY is required}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:?CLERK_SECRET_KEY is required}
      NEXT_PUBLIC_REALTIME_ENABLED: ${NEXT_PUBLIC_REALTIME_ENABLED:-false}
    ports:
      - ${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-3000}:3000
    restart: unless-stopped
