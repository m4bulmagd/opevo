services:
  postgres:
    image: postgres:17.8-bookworm
    container_name: ai-call-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ai_call
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_call"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4.7-alpine
    container_name: ai-call-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: quay.io/minio/minio:RELEASE.2025-07-23T15-54-02Z
    container_name: ai-call-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-07-21T05-28-08Z
    container_name: ai-call-minio-init
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/recordings
      "
    environment:
      STORAGE_BUCKET_NAME: recordings

  api:
    profiles: ["app"]
    build:
      context: ./apps/api
    container_name: ai-call-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/ai_call
      REDIS_URL: redis://redis:6379/0
      CLERK_ISSUER: ${CLERK_ISSUER:-https://your-clerk-instance.clerk.accounts.dev}
      CLERK_AUDIENCE: ${CLERK_AUDIENCE:-ai-call-assistant}
      CLERK_JWT_SECRET: ${CLERK_JWT_SECRET:-replace-me}
      CLERK_WEBHOOK_SECRET: ${CLERK_WEBHOOK_SECRET:-replace-me}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-replace-me}
      LIVEKIT_URL: ${LIVEKIT_URL:-wss://your-project.livekit.cloud}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-replace-me}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-replace-me}
      LIVEKIT_AGENT_NAME: ${LIVEKIT_AGENT_NAME:-ai-call-agent}
      TELNYX_API_KEY: ${TELNYX_API_KEY:-replace-me}
      TELNYX_ACTIVE_CONNECTION_ID: ${TELNYX_ACTIVE_CONNECTION_ID:-replace-me}
      TELNYX_DISABLED_CONNECTION_ID: ${TELNYX_DISABLED_CONNECTION_ID:-replace-me}
      STORAGE_BUCKET_NAME: recordings
      S3_ENDPOINT_URL: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_REGION: us-east-1
      OPENAI_API_KEY: ${OPENAI_API_KEY:-replace-me}
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:-replace-me}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-replace-me}
    ports:
      - "8000:8000"

  agent:
    profiles: ["app"]
    build:
      context: ./apps/agent
    container_name: ai-call-agent
    depends_on:
      redis:
        condition: service_healthy
    environment:
      LIVEKIT_URL: ${LIVEKIT_URL:-wss://your-project.livekit.cloud}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-replace-me}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-replace-me}
      LIVEKIT_AGENT_NAME: ${LIVEKIT_AGENT_NAME:-ai-call-agent}
      REDIS_URL: redis://redis:6379/0
      OPENAI_API_KEY: ${OPENAI_API_KEY:-replace-me}
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:-replace-me}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-replace-me}

volumes:
  postgres_data:
  redis_data:
  minio_data:
